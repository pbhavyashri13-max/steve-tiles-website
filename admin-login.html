
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Steve Tiles Studio</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(135deg, #f5f0e8, #e8dfd1);
}

.login-card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    padding: 45px 38px;
    border-radius: 18px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.10);
}

.brand {
    text-align: center;
    margin-bottom: 35px;
}

.brand h1 {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    color: #8b704b;
}

.brand p {
    color: #888;
    font-size: 13px;
    margin-top: 8px;
    letter-spacing: 2px;
}

.login-title {
    text-align: center;
    font-size: 22px;
    color: #292929;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #888;
    font-size: 13px;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #444;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
}

input:focus {
    border-color: #a78652;
    box-shadow: 0 0 0 3px rgba(167,134,82,0.12);
}

.password-wrap {
    position: relative;
}

.password-wrap input {
    padding-right: 65px;
}

.toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    color: #8b704b;
    cursor: pointer;
    font-size: 12px;
}

.login-btn {
    width: 100%;
    padding: 15px;
    background: #a78652;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
}

.login-btn:hover {
    background: #8b704b;
}

.message {
    display: none;
    margin-top: 16px;
    text-align: center;
    font-size: 13px;
    color: #c0392b;
}

.footer {
    text-align: center;
    margin-top: 28px;
    font-size: 12px;
    color: #999;
}

@media(max-width: 480px) {
    .login-card {
        padding: 35px 24px;
    }
}
</style>
</head>

<body>

<div class="login-card">

    <div class="brand">
        <h1>Steve Tiles</h1>
        <p>STUDIO</p>
    </div>

    <h2 class="login-title">Admin Login</h2>
    <p class="subtitle">Sign in to access your dashboard</p>

    <form id="loginForm">

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username"
                   placeholder="Enter username" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <div class="password-wrap">
                <input type="password" id="password"
                       placeholder="Enter password" required>

                <button type="button" class="toggle-password"
                        onclick="togglePassword()">Show</button>
            </div>
        </div>

        <button type="submit" class="login-btn">
            Login to Dashboard
        </button>

        <p class="message" id="errorMessage">
            Invalid username or password.
        </p>

    </form>

    <div class="footer">
        © 2026 Steve Tiles Studio
    </div>

</div>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const button = document.querySelector(".toggle-password");

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "Hide";
    } else {
        password.type = "password";
        button.textContent = "Show";
    }
}

document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    document.getElementById("errorMessage").style.display = "block";
});
</script>

</body>
</html>
